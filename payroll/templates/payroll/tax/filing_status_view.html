{% extends 'index.html' %}
{% load static i18n %}

{% block content %}
    {% include 'generic/components.html' %}

    <div class="mt-5 oh-wrapper">
        {{ income_tax_nav|safe }}
    </div>

    <div class="oh-wrapper mt-3">
        <div
            id="FilingStatusList"
            class="oh-card"
        >
            {{ income_tax_list|safe }}
        </div>

    <div
        class="oh-modal"
        id="objectUpdateModal"
        role="dialog"
        aria-labelledby="objectUpdateModalLabel"
        aria-hidden="true"
    >
        <div class="oh-modal__dialog" id="objectUpdateModalTarget"></div>
    </div>
{% endblock content %}
