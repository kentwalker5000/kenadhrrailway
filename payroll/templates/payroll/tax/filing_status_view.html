{% extends 'index.html' %}
{% load static i18n %}

{% block content %}
    {% include 'generic/components.html' %}

    <div
        hx-get="{% url 'filing-status-nav' %}?{{ request.GET.urlencode }}"
        hx-trigger="load"
    >
        <div class="mt-5 oh-wrapper animated-background" style="height: 80px"></div>
    </div>

    <div class="oh-wrapper mt-3">
        <div
            id="FilingStatusList"
            class="oh-card"
            hx-get="{% url 'filing-status-search' %}?{{ request.GET.urlencode }}"
            hx-trigger="load"
        >
            <div class="animated-background" style="height: 260px"></div>
        </div>
    </div>

    <div
        class="oh-modal"
        id="objectUpdateModal"
        role="dialog"
        aria-labelledby="objectUpdateModalLabel"
        aria-hidden="true"
    >
        <div class="oh-modal__dialog" id="objectUpdateModalTarget"></div>
    </div>
{% endblock content %}
