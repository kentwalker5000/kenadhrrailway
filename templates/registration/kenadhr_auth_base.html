{% load static i18n %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}KenadHr{% endblock %}</title>
  <link rel="icon" href="{% static 'favicons/kenadhr-32.png' %}">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#f5f7fb; color:#172033; font:16px/1.5 Arial,sans-serif; }
    main { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .auth-card { width:100%; max-width:460px; padding:32px; background:white; border:1px solid #e3e9f2; border-radius:16px; box-shadow:0 8px 30px #1720330c; }
    .brand { display:block; color:#204be6; font-weight:700; text-decoration:none; font-size:25px; margin-bottom:24px; }
    h1 { font-size:24px; line-height:1.3; margin:0 0 16px; }
    p { color:#526077; }
    label { display:block; font-weight:600; margin:18px 0 6px; }
    input { display:block; width:100%; padding:12px; border:1px solid #b6c2d4; border-radius:6px; font:inherit; }
    input:focus { outline:2px solid #204be6; outline-offset:2px; }
    button, .primary { display:block; width:100%; margin-top:24px; padding:12px; background:#204be6; color:white; border:0; border-radius:6px; font:inherit; font-weight:600; text-align:center; text-decoration:none; cursor:pointer; }
    a { color:#204be6; }
    .errorlist { color:#ac2020; padding-left:20px; }
    .help { color:#526077; font-size:13px; }
    .back { display:block; text-align:center; margin-top:20px; }
  </style>
</head>
<body><main><section class="auth-card" aria-labelledby="page-title">
  <a class="brand" href="{% url 'login' %}">KenadHr</a>
  {% block content %}{% endblock %}
</section></main></body>
</html>
