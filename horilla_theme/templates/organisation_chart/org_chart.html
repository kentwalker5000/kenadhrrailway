{% extends 'index.html' %}
{% load i18n %}

{% block styles %}
    <style>
        .oh-org-chart__topbar {
            padding-top: 0;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="oh-wrapper oh-main__topbar oh-org-chart__topbar">
        <div class="oh-main__titlebar oh-main__titlebar--left oh-org-chart__titlebar">
            <div class="oh-org-chart__heading">
                <h1 class="text-lg font-semibold oh-org-chart__title">
                    {% trans "Organization Chart" %}
                </h1>

                <div class="oh-org-chart__manager-row">
                    <label class="oh-org-chart__manager-label" for="managerSelect">
                        {% trans "Drill down by reporting manager" %} :
                    </label>
                    <div class="oh-org-chart__manager-select">
                        <select
                            id="managerSelect"
                            class="oh-select {% if not reporting_manager_dict %} hidden {% endif %}"
                            name="manager_id"
                            title="{% trans 'Drill down by reporting manager' %}"
                            hx-post="{% url 'organisation-chart' %}"
                            hx-target="#chart_target"
                            hx-swap="innerHTML"
                            hx-trigger="change"
                        >
                            {% for manager_id, values in reporting_manager_dict.items %}
                                <option
                                    value="{{ manager_id }}"
                                    {% if act_manager_id == manager_id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ values }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="oh-main__titlebar oh-main__titlebar--right oh-org-chart__search">
            <div class="relative">
                <input
                    class="text-color-600 ps-8 p-1.5 pb-2 placeholder:text-xs w-full border border-dark-50 rounded-md focus-visible:outline-0 placeholder:text-dark-100 text-sm [transition:.3s] focus:border-primary-600"
                    type="text"
                    name="search"
                    placeholder="{% trans 'Search' %}"
                    autocomplete="false"
                    id="searchInput"
                >
                <i
                    class="fas fa-search absolute left-3 top-[1px] bottom-0 m-auto flex items-center opacity-50 text-xs"
                ></i>
            </div>
        </div>
    </div>
    <div class="oh-wrapper" id="chart_target">
        {% include "organisation_chart/chart.html" %}
    </div>
{% endblock %}
