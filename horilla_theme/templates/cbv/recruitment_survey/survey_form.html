{% load i18n %}
<div id="formContainer">
    {% include "generic/horilla_form.html" %}
    <button
        hidden
        hx-target="#moreOptionContainer_{{form.option_count}}"
        hx-swap="outerHTML"
        hx-post="{% url 'add-remove-options-field' %}"
        role="button"
        class="text-primary-600"
        id="addMoreOptions"
    >
        {% trans "Add more options.." %}
    </button>
</div>

<script>
    (function () {
        const root = document.getElementById("formContainer");
        if (!root) return;

        const typeSelect = root.querySelector('form [name="type"]');
        const optionsGroup = root.querySelector("#id_options_parent_div");
        const addMoreTrigger = root.querySelector("#addMoreOptions");
        const choiceTypes = new Set(["options", "multiple"]);
        const typeHints = {
            checkbox: "Applicants will choose Yes or No.",
            text: "Applicants will enter a short text response.",
            number: "Applicants will enter a number.",
            percentage: "Applicants will enter a value from 0 to 100%.",
            date: "Applicants will select a date.",
            textarea: "Applicants will enter a longer text response.",
            file: "Applicants will upload a file.",
            rating: "Applicants will select a rating.",
        };

        const hint = document.createElement("p");
        hint.id = "questionTypeHint";
        hint.className = "mt-2 text-xs text-dark-100";
        hint.setAttribute("aria-live", "polite");

        function removeOptionControls() {
            root.querySelectorAll('[id^="moreOptionContainer_"]').forEach(function (element) {
                element.remove();
            });
        }

        function addOptionsControl() {
            if (!optionsGroup || root.querySelector("#addOptions")) return;

            const container = document.createElement("div");
            container.id = "moreOptionContainer_{{ form.option_count }}";
            container.className = "pt-2 text-primary-600";
            container.style.textAlign = "end";

            const button = document.createElement("button");
            button.type = "button";
            button.id = "addOptions";
            button.className = "text-xs font-medium text-primary-600 hover:underline";
            button.textContent = "Add another option";
            button.addEventListener("click", function () {
                addMoreTrigger.click();
            });

            container.appendChild(button);
            optionsGroup.insertAdjacentElement("afterend", container);
        }

        function updateQuestionType() {
            const type = typeSelect ? typeSelect.value : "";
            const usesOptions = choiceTypes.has(type);

            if (optionsGroup) {
                optionsGroup.style.display = usesOptions ? "" : "none";
            }

            removeOptionControls();
            if (usesOptions) {
                addOptionsControl();
                hint.textContent = type === "multiple"
                    ? "Add the answers applicants can select. They may select more than one."
                    : "Add the answers applicants can choose from. They may select one.";
            } else {
                hint.textContent = typeHints[type] || "Choose a question type to see how applicants will answer.";
            }

            if (!hint.parentNode && optionsGroup) {
                optionsGroup.insertAdjacentElement("afterend", hint);
            }
        }

        $(document)
            .off("change.surveyQuestionType", "#formContainer form [name=type]")
            .on("change.surveyQuestionType", "#formContainer form [name=type]", updateQuestionType);

        updateQuestionType();

        $("#{{ view_id }}Form").find("select").select2({
            width: "100%"
        });
    })();
</script>
