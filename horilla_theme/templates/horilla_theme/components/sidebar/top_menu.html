{% load i18n static %}
{% comment %}
  Dashboard is deliberately a normal navigation link. The dashboard has its
  own data-loading lifecycle, so a full document navigation prevents stale
  chart requests or duplicate HTMX swaps from competing with one another.
{% endcomment %}
<a
    href="{% url 'dashboard' %}"
    class="sideboxmain group flex items-center gap-3 px-3 py-2.5 rounded-lg w-full transition duration-300"
    data-menu="Dashboard"
>
    <img
        src="{% static 'images/ui/dashboard.svg' %}"
        alt=""
        class="w-4.5 h-4.5 flex-shrink-0 transition duration-300 filter brightness-1 invert"
    >
    <span
        class="oh-sidebar-label text-sm font-medium truncate flex-1 text-left"
        aria-hidden="true"
    >{% trans "Dashboard" %}</span>
</a>
