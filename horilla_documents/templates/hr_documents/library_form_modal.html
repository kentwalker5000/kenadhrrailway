{% load i18n widget_tweaks %}
<div class="oh-modal__dialog-header"><h2 class="text-md font-semibold">{{ title }}</h2><button type="button" class="oh-modal__close--custom" aria-label="{% trans 'Close' %}" onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"><ion-icon name="close-outline"></ion-icon></button></div>
<div class="oh-modal__dialog-body oh-modal__dialog-relative"><form method="post" enctype="multipart/form-data" hx-post="{{ request.path }}" hx-target="#{{ modal_target }}" hx-encoding="multipart/form-data">{% csrf_token %}<div class="oh-profile-section bg-[white] rounded-md border border-dark-50 p-[20px] w-full">{{ form.non_field_errors }}<div class="row">{% for field in form.visible_fields %}<div class="{% if field.name == 'description' or field.name == 'document' %}col-12{% else %}col-12 col-md-6{% endif %} mb-3"><label class="oh-label {% if field.field.required %}required-star{% endif %}" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field|add_class:'oh-input w-100' }}{{ field.errors }}{% if field.help_text %}<small class="text-xs text-[#666]">{{ field.help_text }}</small>{% endif %}</div>{% endfor %}</div><div class="flex gap-2 justify-end pt-3"><button type="button" class="oh-btn oh-btn--light" onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')">{% trans "Cancel" %}</button><button class="oh-btn oh-btn--secondary" type="submit">{% trans "Save" %}</button></div></div></form></div>
