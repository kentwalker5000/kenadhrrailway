{% extends 'index.html' %} {% load i18n %} {% block content %}

<div id="profileEditor">
<section
	class="oh-wrapper oh-main__topbar oh-profile-section__topbar"
	x-data="{searchShow: false}"
>
	<div class="oh-main__titlebar oh-main__titlebar--left">
		<h1 class="oh-main__titlebar-title fw-bold mb-0">
			{% trans "Edit Profile" %}
		</h1>
	</div>
	<div
		class="oh-main__titlebar oh-main__titlebar--left d-flex align-items-center"
	>
		<ul class="oh-general__tabs oh-profile-section__tab">
			<li class="oh-general__tab">
				<button
					type="button"
					class="oh-general__tab-link oh-general__tab-link--active"
					data-profile-tab="personal"
					aria-controls="personal"
					aria-pressed="true"
					>{% trans "Personal Info" %}</button
				>
			</li>
			<li class="oh-general__tab">
				<button
					type="button"
					class="oh-general__tab-link"
					data-profile-tab="bank"
					aria-controls="bank"
					aria-pressed="false"
					>{% trans "Bank Info" %}</button
				>
			</li>
		</ul>
	</div>
</section>
<div class="oh-wrapper">
	{% include 'employee/profile/personal_info.html' %}
    {% include 'employee/profile/bank_info.html' %}
</div>
</div>

<script id="profileEditorTabs">
    (() => {
        const editor = document.getElementById("profileEditor");
        const tabs = editor.querySelectorAll("[data-profile-tab]");
        const panels = editor.querySelectorAll(".oh-general__tab-target");
        const storageKey = "staffProfileEditTab";

        // Change local panel state only. Synthetic anchor clicks trigger the
        // shared popstate reload handler and can recursively re-enter this code.
        function activateTab(target) {
            if (!["personal", "bank"].includes(target)) target = "personal";
            tabs.forEach(tab => {
                const active = tab.dataset.profileTab === target;
                tab.classList.toggle("oh-general__tab-link--active", active);
                tab.setAttribute("aria-pressed", String(active));
            });
            panels.forEach(panel => {
                const hidden = panel.id !== target;
                panel.hidden = hidden;
                panel.classList.toggle("d-none", hidden);
            });
            return target;
        }

        let savedTab = "personal";
        try { savedTab = localStorage.getItem(storageKey); } catch (_) {}
        activateTab(savedTab);
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                const target = activateTab(tab.dataset.profileTab);
                try { localStorage.setItem(storageKey, target); } catch (_) {}
            });
        });
    })();
</script>

{% endblock content %}
