{% extends "index.html" %}
{% load i18n %}

{% block content %}
    <style>
        .asset-category-page .oh-main__titlebar-title {
            color: #163a63;
        }
        .asset-category-page .oh-btn--secondary {
            border-color: #1d4ed8;
            background: #1d4ed8;
            color: #fff;
        }
        .asset-category-page .oh-btn--secondary:hover,
        .asset-category-page .oh-btn--secondary:focus {
            border-color: #163a63;
            background: #163a63;
            color: #fff;
        }
        .asset-category-page .oh-accordion-meta {
            overflow: hidden;
            border: 1px solid rgba(22, 58, 99, 0.12);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }
        .asset-category-page .oh-accordion-meta__header {
            min-height: 58px;
        }
        .asset-category-page .oh-accordion-meta__title {
            color: #163a63;
            font-weight: 600;
        }
        .asset-category-page .oh-badge--secondary {
            background: #e8f0ff;
            color: #1d4ed8;
        }
    </style>

    {% include "generic/components.html" %}

    <main class="asset-category-page" :class="sidebarOpen ? 'oh-main__sidebar-visible' : ''">
        <div hx-get="{% url 'asset-category-nav' %}" hx-trigger="load"></div>

        <div
            class="oh-checkpoint-badge mb-2"
            id="selectedInstances"
            data-ids="[]"
            data-clicked=""
            style="display: none"
        ></div>

        <div class="oh-wrapper" id="assetCategoryList"></div>
    </main>
{% endblock content %}
