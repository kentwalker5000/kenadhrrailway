name: Windows native runner

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-safety-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install database client for migration helper tests
        run: python -m pip install psycopg2-binary==2.9.10
      - name: Check startup and copy safeguards without touching live data
        run: python -m unittest discover -s scripts/tests -v
