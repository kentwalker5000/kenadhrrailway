<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - KenadHr</title>
    <link rel="stylesheet" href="../static/build/css/style.min.css" />
  </head>
  <body>
    <div id="main">
      <main class="oh-auth">
        <div class="oh-auth-card">
          <h1 class="oh-onboarding-card__title oh-onboarding-card__title--h2 text-center my-3">Sign In</h1>
          <p class="text-muted text-center">Continue to KenadHr to sign in to your workspace.</p>
          <div class="oh-form-group">
            <a
              href="http://localhost:8000/login/"
              class="oh-btn oh-onboarding-card__button mt-4 oh-btn--secondary oh-btn--shadow w-100 mb-4">
              Secure Sign-in
            </a>
            <small class="text-center"><a href="http://localhost:8000/forgot-password/" class="oh-link oh-link--secondary justify-content-center">Forgot password?</a></small>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
