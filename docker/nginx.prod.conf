events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    map "$request_uri|$http_referer" $kenadhr_log_request {
        default 1;
        ~*/(?:accounts/)?reset/ 0;
    }
    access_log /var/log/nginx/access.log combined if=$kenadhr_log_request;
    limit_req_zone $binary_remote_addr zone=kenadhr_login:10m rate=5r/m;
    limit_req_status 429;
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 50M;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location /static/ { alias /static/; expires 1d; }
        location /metrics/ { deny all; }
        location ~ ^/(login|admin/login|api/(v1/)?auth/login)/?$ {
            limit_req zone=kenadhr_login burst=10 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
        }
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
        }
    }
}
